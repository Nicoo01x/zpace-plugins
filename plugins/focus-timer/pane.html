<style>
  * { box-sizing: border-box; }
  body { display: flex; align-items: center; justify-content: center; height: 100%; }
  main { width: 360px; text-align: center; }
  .modes { display: inline-flex; background: var(--surface-inset); border-radius: 9px; padding: 3px; margin-bottom: 26px; }
  .modes button { border: 0; background: transparent; padding: 6px 16px; border-radius: 7px; font: inherit; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; }
  .modes button.on { background: var(--background); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .ring { position: relative; width: 240px; height: 240px; margin: 0 auto 22px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .track { stroke: var(--surface-inset); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.9s linear; }
  .ring.break .bar { stroke: var(--success); }
  .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .time b { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .time span { margin-top: 6px; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; }
  .row { display: flex; justify-content: center; gap: 8px; }
  button.big { font: inherit; font-size: 13.5px; font-weight: 600; padding: 10px 26px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); cursor: pointer; }
  button.big.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.big:disabled { opacity: 0.4; cursor: default; }
  .presets { margin-top: 18px; display: flex; justify-content: center; gap: 6px; }
  .presets button { font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; }
  .presets button:hover { color: var(--text-primary); border-color: var(--border-strong); }
  .today { margin-top: 26px; font-size: 12.5px; color: var(--text-secondary); }
  .today b { color: var(--text-primary); }
  .dots { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
</style>
<main>
  <div class="modes"><button id="mFocus" class="on">Focus</button><button id="mBreak">Break</button></div>
  <div class="ring" id="ring">
    <svg width="240" height="240" viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="112"/><circle class="bar" id="bar" cx="120" cy="120" r="112" stroke-dasharray="703.7" stroke-dashoffset="0"/></svg>
    <div class="time"><b id="time">25:00</b><span id="label">ready</span></div>
  </div>
  <div class="row"><button class="big primary" id="startPause">Start</button><button class="big" id="reset">Reset</button></div>
  <div class="presets" id="presets"><button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button><button data-m="50">50</button><button data-m="90">90</button></div>
  <div class="today" id="today"></div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  let st = null;
  const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, '0')}`;
  function render(s) {
    st = s;
    const total = s.minutes * 60000;
    $('#time').textContent = fmt(s.remaining);
    $('#label').textContent = s.running ? (s.mode === 'focus' ? 'focusing' : 'on a break') : s.paused !== null ? 'paused' : 'ready';
    $('#bar').style.strokeDashoffset = String(703.7 * (1 - s.remaining / total));
    $('#ring').classList.toggle('break', s.mode === 'break');
    $('#mFocus').classList.toggle('on', s.mode === 'focus');
    $('#mBreak').classList.toggle('on', s.mode === 'break');
    $('#startPause').textContent = s.running ? 'Pause' : s.paused !== null ? 'Resume' : 'Start';
    $('#reset').disabled = !s.running && s.paused === null;
    const n = s.today?.date === new Date().toISOString().slice(0, 10) ? s.today.focus : 0;
    $('#today').innerHTML = `<b>${n}</b> focus block${n === 1 ? '' : 's'} today${n ? `<span class="dots">${'<i></i>'.repeat(Math.min(n, 12))}</span>` : ''}`;
  }
  $('#startPause').onclick = () => zpace.post({ type: st?.running ? 'pause' : 'start' });
  $('#reset').onclick = () => zpace.post({ type: 'reset' });
  $('#mFocus').onclick = () => zpace.post({ type: 'mode', mode: 'focus' });
  $('#mBreak').onclick = () => zpace.post({ type: 'mode', mode: 'break' });
  $('#presets').onclick = (e) => { const m = e.target.dataset.m; if (m) zpace.post({ type: 'start', mode: 'focus', minutes: Number(m) }); };
  zpace.on('message', render);
  zpace.post({ type: 'hello' });
</script>
