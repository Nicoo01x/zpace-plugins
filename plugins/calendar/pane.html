<style>
  * { box-sizing: border-box; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 280px; height: 100%; overflow: hidden; font-size: 13px; }
  .cal { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; min-width: 150px; }
  header button { font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); cursor: pointer; }
  header button:hover { border-color: var(--border-strong); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .dow span { padding: 4px 6px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; flex: 1; padding: 0 10px 10px; gap: 3px; min-height: 0; }
  .day { border-radius: 9px; padding: 6px; background: var(--surface-inset); cursor: pointer; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
  .day:hover { outline: 1px solid var(--border-strong); }
  .day.other { opacity: 0.45; }
  .day.today .n { background: var(--accent); color: #fff; }
  .day.selected { outline: 2px solid var(--accent); }
  .day .n { font-size: 11.5px; font-variant-numeric: tabular-nums; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
  .day .ev { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .more { font-size: 10px; color: var(--text-muted); }
  aside { display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 12px; margin: 0; padding: 14px 16px 6px; color: var(--text-secondary); font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 4px; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--surface-inset); }
  .item .t { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size: 12px; min-width: 40px; }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 500; }
  .item .tools { display: flex; gap: 2px; }
  .item .tools button { font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; }
  .item .tools button:hover { background: var(--surface); border-color: var(--border); color: var(--text-primary); }
  .add { padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  .add input { font: inherit; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--background); color: var(--text-primary); outline: none; }
  .add input:focus { border-color: var(--accent); }
  .add .row { display: flex; gap: 6px; }
  .add .row input[type=time] { width: 110px; }
  .add button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px; border-radius: 7px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .empty { color: var(--text-muted); font-size: 12px; padding: 10px 6px; }
</style>
<div class="cal">
  <header><h1 id="month"></h1><button id="prev">‹</button><button id="today">Today</button><button id="next">›</button></header>
  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
</div>
<aside>
  <h2 id="dayTitle"></h2>
  <div class="list" id="list"></div>
  <form class="add" id="add">
    <input id="title" placeholder="New event" autocomplete="off" required>
    <div class="row"><input type="time" id="time"><button type="submit">Add</button></div>
  </form>
</aside>
<script>
  const $ = (s) => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let events = [];
  let cursor = new Date(); cursor.setDate(1);
  let selected = iso(new Date());
  const lang = navigator.language;
  const monthName = (d) => d.toLocaleDateString(lang, { month: 'long', year: 'numeric' });
  const save = () => zpace.storage.set('events', events);

  async function load() { events = (await zpace.storage.get('events')) ?? []; render(); }

  function render() {
    $('#month').textContent = monthName(cursor).replace(/^./, (c) => c.toUpperCase());
    const first = new Date(cursor); const startDow = (first.getDay() + 6) % 7; // Monday first
    const days = [];
    const start = new Date(first); start.setDate(first.getDate() - startDow);
    for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
    const dow = []; for (let i = 0; i < 7; i++) dow.push(new Date(2024, 0, 1 + i).toLocaleDateString(lang, { weekday: 'short' }));
    $('#dow').innerHTML = dow.map((d) => `<span>${esc(d)}</span>`).join('');
    const todayIso = iso(new Date());
    $('#grid').innerHTML = days.map((d) => {
      const k = iso(d); const evs = events.filter((e) => e.date === k).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
      return `<div class="day${d.getMonth() !== cursor.getMonth() ? ' other' : ''}${k === todayIso ? ' today' : ''}${k === selected ? ' selected' : ''}" data-d="${k}"><span class="n">${d.getDate()}</span>${evs.slice(0, 3).map((e) => `<span class="ev">${e.time ? e.time + ' ' : ''}${esc(e.title)}</span>`).join('')}${evs.length > 3 ? `<span class="more">+${evs.length - 3}</span>` : ''}</div>`;
    }).join('');
    for (const el of document.querySelectorAll('.day')) el.onclick = () => { selected = el.dataset.d; render(); $('#title').focus(); };
    renderDay();
  }

  function renderDay() {
    const d = new Date(selected + 'T00:00:00');
    $('#dayTitle').textContent = d.toLocaleDateString(lang, { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, (c) => c.toUpperCase());
    const evs = events.filter((e) => e.date === selected).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const list = $('#list');
    list.innerHTML = evs.length ? '' : '<div class="empty">Nothing on this day.</div>';
    for (const e of evs) {
      const el = document.createElement('div'); el.className = 'item';
      el.innerHTML = `<span class="t">${e.time || '—'}</span><div class="body"><div class="title">${esc(e.title)}</div></div><div class="tools"><button title="${e.noteId ? 'Open the note' : 'Create a note'}">📝</button><button title="Delete">×</button></div>`;
      const [note, del] = el.querySelectorAll('button');
      note.onclick = async () => { if (e.noteId) return zpace.notes.open(e.noteId); e.noteId = await zpace.notes.create({ title: e.title, body: `# ${e.title}\n\n${e.date}${e.time ? ' ' + e.time : ''}\n\n`, tags: ['calendar'] }); save(); zpace.notes.open(e.noteId); };
      del.onclick = () => { events = events.filter((x) => x.id !== e.id); save(); render(); };
      list.appendChild(el);
    }
  }

  $('#add').onsubmit = (ev) => { ev.preventDefault(); const title = $('#title').value.trim(); if (!title) return; events.push({ id: uid(), date: selected, time: $('#time').value, title }); save(); $('#title').value = ''; render(); };
  $('#prev').onclick = () => { cursor.setMonth(cursor.getMonth() - 1); render(); };
  $('#next').onclick = () => { cursor.setMonth(cursor.getMonth() + 1); render(); };
  $('#today').onclick = () => { cursor = new Date(); cursor.setDate(1); selected = iso(new Date()); render(); };
  load();
</script>
